services:
 postgres:
  image: postgres:16
  command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
  environment: {POSTGRES_USER: quickticket, POSTGRES_PASSWORD: quickticket, POSTGRES_DB: quickticket}
  ports: ["5432:5432"]
  volumes: ["quickticket_data:/var/lib/postgresql/data","./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro"]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U quickticket -d quickticket"], interval: 5s, timeout: 3s, retries: 20}
 redis:
  image: redis:7-alpine
  ports: ["6379:6379"]
 kafka:
  image: apache/kafka:3.8.0
  ports: ["9092:9092"]
  environment:
   KAFKA_NODE_ID: 1
   KAFKA_PROCESS_ROLES: broker,controller
   KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
   KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
   KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
   KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
   KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
   KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
   KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
   KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
   KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
 catalog:
  build: {context: ./services/catalog, dockerfile: Dockerfile}
  environment: {DATABASE_URL: postgres://quickticket:quickticket@postgres:5432/quickticket?sslmode=disable, PORT: "8081"}
  ports: ["8081:8081"]
  depends_on: {postgres: {condition: service_healthy}}
 inventory:
  build: {context: ./services/inventory, dockerfile: Dockerfile}
  environment: {DATABASE_URL: postgres://quickticket:quickticket@postgres:5432/quickticket?sslmode=disable, REDIS_ADDR: redis:6379, PORT: "8082"}
  ports: ["8082:8082"]
  depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
 booking:
  build: {context: ./services/booking, dockerfile: Dockerfile}
  environment: {DATABASE_URL: postgres://quickticket:quickticket@postgres:5432/quickticket?sslmode=disable, REDIS_ADDR: redis:6379, KAFKA_BROKERS: kafka:9092, KAFKA_TOPIC: booking-events, PORT: "8083"}
  ports: ["8083:8083"]
  depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}, kafka: {condition: service_started}}
 waiting-room:
  build: {context: ./services/waiting-room, dockerfile: Dockerfile}
  environment: {REDIS_ADDR: redis:6379, PORT: "8084", QUEUE_CAPACITY: "2", ADMISSION_TTL_SECONDS: "600"}
  ports: ["8084:8084"]
  depends_on: {redis: {condition: service_started}}

 elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
  environment:
   discovery.type: single-node
   xpack.security.enabled: "false"
   ES_JAVA_OPTS: -Xms512m -Xmx512m
  ports: ["9200:9200"]
  healthcheck:
   test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
   interval: 10s
   timeout: 5s
   retries: 30
 debezium:
  image: quay.io/debezium/connect:2.7
  ports: ["8086:8083"]
  environment:
   BOOTSTRAP_SERVERS: kafka:9092
   GROUP_ID: quickticket-connect
   CONFIG_STORAGE_TOPIC: quickticket-connect-configs
   OFFSET_STORAGE_TOPIC: quickticket-connect-offsets
   STATUS_STORAGE_TOPIC: quickticket-connect-status
   CONFIG_STORAGE_REPLICATION_FACTOR: 1
   OFFSET_STORAGE_REPLICATION_FACTOR: 1
   STATUS_STORAGE_REPLICATION_FACTOR: 1
  depends_on:
   postgres: {condition: service_healthy}
   kafka: {condition: service_started}
 debezium-register:
  image: curlimages/curl:8.10.1
  volumes: ["./infra/debezium:/config:ro"]
  entrypoint: ["/bin/sh", "/config/register-postgres.sh"]
  environment: {CONNECT_URL: http://debezium:8083}
  depends_on:
   debezium: {condition: service_started}
 search:
  build: {context: ./services/search, dockerfile: Dockerfile}
  environment:
   ELASTICSEARCH_URL: http://elasticsearch:9200
   ELASTICSEARCH_INDEX: quickticket-events
   KAFKA_BROKERS: kafka:9092
   CDC_TOPIC: quickticket.public.events
   CDC_GROUP: quickticket-search-indexer
   PORT: "8085"
  ports: ["8085:8085"]
  depends_on:
   elasticsearch: {condition: service_healthy}
   kafka: {condition: service_started}
   debezium-register: {condition: service_completed_successfully}
 booking-events:
  build: {context: ./services/booking-events, dockerfile: Dockerfile}
  environment: {KAFKA_BROKERS: kafka:9092, KAFKA_TOPIC: booking-events, KAFKA_GROUP: booking-event-log}
  depends_on: {kafka: {condition: service_started}}
volumes:
 quickticket_data:
